<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><style>text{font-family:Segoe UI,Microsoft JhengHei,sans-serif;fill:#243730}.title{font-size:38px;font-weight:700}.body{font-size:26px}.muted{fill:#52665c;font-size:21px}.box{fill:#e7f0e8;stroke:#21664e;stroke-width:2}</style><rect width="1100" height="680" fill="#fffefb"/><text class="title" x="72" y="90">Queue · FIFO</text><text class="body" x="72" y="145">先進先出：從尾端加入、前端取出</text><rect class="box" x="230" y="270" width="170" height="110" rx="8"/><text class="body" x="302" y="337">A</text><rect class="box" x="440" y="270" width="170" height="110" rx="8"/><text class="body" x="512" y="337">B</text><rect class="box" x="650" y="270" width="170" height="110" rx="8"/><text class="body" x="722" y="337">C</text><text class="body" x="225" y="445">前端 dequeue</text><text class="body" x="650" y="445">尾端 enqueue</text><text class="muted" x="230" y="560">enqueue A → B → C，dequeue 得到 A → B → C</text><text class="muted" x="72" y="640">LectureThread · 原創公開示範</text></svg>